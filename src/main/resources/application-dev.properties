# =====================================
# Project Easy Translate - DEV Profile
# =====================================

spring.application.name=project_easy_translate

# ------------------------------
# Server Port
# ------------------------------
server.port=${SERVER_PORT:8085}

# ------------------------------
# Relational Database (MySQL)
# ------------------------------
#spring.datasource.url=jdbc:mysql://localhost:3306/project_easy_translate?useSSL=false&serverTimezone=UTC
#spring.datasource.username=root
#spring.datasource.password=***REMOVED***

spring.datasource.url=${DB_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:project_easy_translate}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD:change_me}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ------------------------------
# NoSQL Database (MongoDB)
# ------------------------------
spring.data.mongodb.uri=${MONGO_URI:mongodb://${MONGO_USERNAME:root}:${MONGO_PASSWORD:change_me}@localhost:27017/project_easy_translate?authSource=admin}
spring.data.mongodb.database=${MONGO_DATABASE:project_easy_translate}

# ------------------------------
# JWT
# ------------------------------
jwt.secret=${JWT_SECRET:ChangeThisDevSecretKeyAtLeast32Chars_And_Private}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
google.oauth.client-ids=${GOOGLE_OAUTH_CLIENT_IDS:}
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-1.5-flash}
gemini.fallback-models=${GEMINI_FALLBACK_MODELS:gemini-2.0-flash,gemini-2.0-flash-lite,gemini-1.5-flash-latest}
gemini.api-version=${GEMINI_API_VERSION:v1beta}

# ------------------------------
# API / Web
# ------------------------------
api.path=/
spring.web.resources.static-locations=classpath:/static/

# ------------------------------
# Management / Actuator
# ------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.db.enabled=true
management.health.mongo.enabled=true

# ------------------------------
# Logging / Security
# ------------------------------
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF

# ------------------------------
# Security CORS
# ------------------------------
app.security.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.free.daily-token-limit=${FREE_DAILY_TOKEN_LIMIT:15000}
app.story-limit.free-daily=${FREE_DAILY_STORY_LIMIT:3}
app.story-limit.premium-daily=${PREMIUM_DAILY_STORY_LIMIT:20}
app.account.deletion.grace-days=${ACCOUNT_DELETION_GRACE_DAYS:7}
app.auth.email-verification-code-ttl-minutes=${EMAIL_VERIFICATION_CODE_TTL_MINUTES:15}
app.auth.password-reset-code-ttl-minutes=${PASSWORD_RESET_CODE_TTL_MINUTES:15}
app.auth.enable-google-dev-endpoint=${ENABLE_GOOGLE_DEV_ENDPOINT:false}
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@talemind.app}
app.mail.provider=${MAIL_PROVIDER:smtp}
app.resend.api-key=${RESEND_API_KEY:}
app.resend.base-url=${RESEND_BASE_URL:https://api.resend.com}
app.resend.connect-timeout-ms=${RESEND_CONNECT_TIMEOUT_MS:5000}
app.resend.read-timeout-ms=${RESEND_READ_TIMEOUT_MS:5000}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT_MS:5000}
