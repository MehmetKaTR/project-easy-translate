spring.application.name=project_easy_translate

# ------------------------------
# Relational Database (MySQL)
# ------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ------------------------------
# NoSQL Database (MongoDB)
# ------------------------------
spring.data.mongodb.uri=mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@localhost:27017/project_easy_translate?authSource=admin

# ------------------------------
# JWT
# ------------------------------
jwt.secret=${JWT_SECRET}  
jwt.expiration-ms=${JWT_EXPIRATION_MS}
google.oauth.client-ids=${GOOGLE_OAUTH_CLIENT_IDS:}
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-1.5-flash}
gemini.fallback-models=${GEMINI_FALLBACK_MODELS:gemini-2.0-flash,gemini-2.0-flash-lite,gemini-1.5-flash-latest}
gemini.api-version=${GEMINI_API_VERSION:v1beta}

# ------------------------------
# API / Web
# ------------------------------
api.path=/
spring.web.resources.static-locations=classpath:/static/

# ------------------------------
# Management / Actuator
# ------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.db.enabled=true
management.health.mongo.enabled=true

# ------------------------------
# Logging / Security
# ------------------------------
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF

# ------------------------------
# Security CORS
# ------------------------------
app.security.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.free.daily-token-limit=${FREE_DAILY_TOKEN_LIMIT:15000}
